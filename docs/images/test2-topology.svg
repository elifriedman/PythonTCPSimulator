<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Test2 network topology</title>
  <desc id="desc">Host H1 connects to router R1. R1 connects through two parallel paths, R2 and R3, to router R4, which connects to host H2. Each path has 10 Mbps links with 10 millisecond delay and 64 KiB buffers, while the host links are 12.5 Mbps.</desc>
  <style>
    .paper { fill: #f5f5f5; }
    .ink { fill: #2d3142; }
    .muted { fill: #4f5d75; }
    .soft { fill: #7a8399; }
    .rule { stroke: #bfc0c0; }
    .edge { fill: none; stroke: #4f5d75; stroke-width: 2; }
    .node { fill: #fff; stroke: #2d3142; stroke-width: 1.5; }
    .host { fill: rgba(79,93,117,.10); stroke: #4f5d75; }
    .focus { fill: rgba(235,108,54,.08); stroke: #eb6c36; }
    .name { font: 600 18px Arial, sans-serif; fill: #2d3142; text-anchor: middle; }
    .kind { font: 600 10px Arial, sans-serif; letter-spacing: 1.5px; fill: #4f5d75; text-anchor: middle; }
    .label { font: 11px 'Courier New', monospace; fill: #4f5d75; text-anchor: middle; }
    .caption { font: 12px Arial, sans-serif; fill: #4f5d75; }
    .section { font: 600 11px 'Courier New', monospace; letter-spacing: 2px; fill: #7a8399; }
  </style>

  <rect class="paper" width="1000" height="540"/>
  <text x="55" y="45" class="section">TEST2 / NETWORK TOPOLOGY</text>
  <text x="55" y="73" class="ink" font-family="Arial, sans-serif" font-size="26" font-weight="600">Two paths between H1 and H2</text>
  <text x="55" y="96" class="caption">R1 and R4 are connected through parallel router paths; routing cost is one hop per link.</text>

  <!-- Links are drawn first so node boxes remain legible. All non-horizontal paths use rounded elbows. -->
  <path class="edge" d="M140 255 H230"/>
  <path class="edge" d="M300 242 H352 Q360 242 360 234 V143 Q360 135 368 135 H430"/>
  <path class="edge" d="M300 278 H352 Q360 278 360 286 V375 Q360 383 368 383 H430"/>
  <path class="edge" d="M500 135 H552 Q560 135 560 143 V242 Q560 250 568 250 H630"/>
  <path class="edge" d="M500 383 H572 Q580 383 580 375 V278 Q580 270 588 270 H630"/>
  <path class="edge" d="M700 255 H800"/>

  <!-- Link labels sit on opaque paper masks above the connectors. -->
  <g class="label">
    <rect x="145" y="220" width="80" height="18" rx="3" class="paper"/>
    <text x="185" y="233">L0 · 12.5 Mbps</text>
    <rect x="328" y="104" width="100" height="18" rx="3" class="paper"/>
    <text x="378" y="117">L1 · 10 Mbps</text>
    <rect x="328" y="397" width="100" height="18" rx="3" class="paper"/>
    <text x="378" y="410">L2 · 10 Mbps</text>
    <rect x="516" y="165" width="100" height="18" rx="3" class="paper"/>
    <text x="566" y="178">L3 · 10 Mbps</text>
    <rect x="536" y="350" width="100" height="18" rx="3" class="paper"/>
    <text x="586" y="363">L4 · 10 Mbps</text>
    <rect x="716" y="220" width="100" height="18" rx="3" class="paper"/>
    <text x="766" y="233">L5 · 12.5 Mbps</text>
  </g>

  <!-- Nodes -->
  <g>
    <rect x="55" y="220" width="85" height="70" rx="7" class="node host"/>
    <text x="97.5" y="248" class="kind">HOST</text>
    <text x="97.5" y="272" class="name">H1</text>

    <rect x="230" y="220" width="70" height="70" rx="7" class="node focus"/>
    <text x="265" y="248" class="kind">ROUTER</text>
    <text x="265" y="272" class="name">R1</text>

    <rect x="430" y="100" width="70" height="70" rx="7" class="node"/>
    <text x="465" y="128" class="kind">ROUTER</text>
    <text x="465" y="152" class="name">R2</text>

    <rect x="430" y="348" width="70" height="70" rx="7" class="node"/>
    <text x="465" y="376" class="kind">ROUTER</text>
    <text x="465" y="400" class="name">R3</text>

    <rect x="630" y="220" width="70" height="70" rx="7" class="node"/>
    <text x="665" y="248" class="kind">ROUTER</text>
    <text x="665" y="272" class="name">R4</text>

    <rect x="800" y="220" width="85" height="70" rx="7" class="node host"/>
    <text x="842.5" y="248" class="kind">HOST</text>
    <text x="842.5" y="272" class="name">H2</text>
  </g>

  <line x1="55" y1="468" x2="945" y2="468" class="rule" stroke-width="1"/>
  <text x="55" y="496" class="caption"><tspan font-weight="600">Every link:</tspan> 10 ms propagation delay · 64 KiB buffer</text>
  <rect x="650" y="483" width="14" height="14" rx="3" class="focus"/>
  <text x="672" y="495" class="caption">focal router</text>
  <rect x="778" y="483" width="14" height="14" rx="3" class="host"/>
  <text x="800" y="495" class="caption">host</text>
</svg>
